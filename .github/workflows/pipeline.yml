name: Spring Boot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: CI Pipeline for Spring Boot App
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout your code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Set up Java environment
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3️⃣ Compile your Spring Boot application
    - name: Compile Code
      run: mvn compile

    # 4️⃣ Run security scan using OWASP Dependency Check
    - name: Security Check (OWASP)
      run: mvn org.owasp:dependency-check-maven:check
      continue-on-error: false  # fail if vulnerabilities found

    # 5️⃣ Run Unit Tests
    - name: Run Tests
      run: mvn test

    # 6️⃣ Build the JAR package
    - name: Build (Package JAR)
      run: mvn package

    # 7️⃣ Upload the JAR as artifact
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v3
      with:
        name: springboot-app
        path: target/*.jar
