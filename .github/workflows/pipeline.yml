name: Spring Boot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: CI Pipeline for Spring Boot App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Code
      run: mvn compile

    - name: Security Check (OWASP)
      run: mvn org.owasp:dependency-check-maven:check
      continue-on-error: false

    - name: Run Tests
      run: mvn test

    - name: Build (Package JAR)
      run: mvn package

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: springboot-app
        path: target/*.jar
